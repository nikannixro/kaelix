[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaelix"
version = "0.7.3"
description = "Automated MKV metadata editing, track renaming, and batch renaming tool."
authors = [{ name = "N I K A N" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
kaelix = "src.main:main"

[project.urls]
Homepage = "https://github.com/nikannixro/kaelix"
Repository = "https://github.com/nikannixro/kaelix"
Issues = "https://github.com/nikannixro/kaelix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
